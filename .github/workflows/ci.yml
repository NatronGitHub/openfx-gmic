name: Continuous Integration

# Natron CI policy: per PR/push, exactly three full builds plus tests (macOS 15 arm64 with the
# system clang and MacPorts libraries, Ubuntu 24.04, Windows MSYS2 UCRT64). Extra variants (debug
# builds, a C++20 build) run nightly or on demand; the per-PR builds use C++17 (Natron RB-2.6
# policy: Qt5 builds C++17, Qt6 builds C++20); build artifacts are uploaded only on demand or for pre-release tags.
#
# The builds use CMake (NatronGitHub/Natron#1181). The Makefile is still what Natron's
# build-plugins.sh uses: the nightly Linux debug variant is built with it instead of CMake (no
# extra build), and its bundle is compared with the CMake one (compare_bundles.sh).
#
# Frugal CI (the NatronGitHub runners are shared by all repos): one run per change. Pushes run CI
# only on master and tags; feature branches run through their pull request. Draft pull requests
# don't run CI. Superseded runs are cancelled, except for tags. The nightly run is skipped when
# master didn't change. Jobs time out.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC: also builds the variants (debug, C++20)
  # pushes to master (and tags) only: pull requests are built by the pull_request trigger,
  # so that each PR push is not built twice
  push:
    branches: [ master ]
    tags: [ '*' ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'

# One group per event type and PR number (branch names can collide across forks) or ref (master,
# tags): a new run cancels the superseded one, except for tags. The event type keeps a master push
# from cancelling the nightly or on-demand run, which also builds the variants.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # number of plug-ins expected from the pinned G'MIC version: update when upgrading G'MIC
  GMIC_PLUGIN_COUNT: 1205
  # extra variants (debug, C++20) only on the nightly schedule or on demand
  BUILD_VARIANTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # artifacts only on demand or for pre-release tags (containing "alpha", "beta" or "rc", e.g.
  # Natron-2.6.0-rc1; contains() is case-insensitive)
  UPLOAD_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc'))) }}

jobs:
  # Skip the nightly scheduled run if master didn't change since the previous one
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' # only the scheduled run needs the history
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits in the last 25 hours: skipping."
          fi

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libfftw3-dev zlib1g-dev libcurl4-openssl-dev \
            libpng-dev libexpat1-dev libgl-dev
      # the tarball, downloaded into the source directory (GMIC_DOWNLOAD_DIR), where both the
      # CMake and the Makefile builds find it
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: gmic_*.tar.gz
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD"
          cmake --build build -j4
      - name: Describe all plug-ins
        run: .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      # the debug variant is built with the Makefile, as Natron's build-plugins.sh does (the
      # standard in CXX), and its bundle is compared with the installed CMake one
      - name: Build with the Makefile (debug), compare with CMake
        if: env.BUILD_VARIANTS == 'true'
        run: |
          make -j4 CONFIG=debug OPENMP=1 CXX="g++ -std=c++17"
          cmake --install build --prefix install
          .github/workflows/compare_bundles.sh GMIC_OFX/Linux-64-debug/GMIC.ofx.bundle install/GMIC.ofx.bundle
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-linux-release
          path: build/Plugins/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DGMIC_DOWNLOAD_DIR="$PWD"
          cmake --build build-cxx20 -j4
          .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT

  macos:
    name: macOS 15 arm64 (Apple clang, MacPorts libraries)
    runs-on: macos-15
    # macOS arm64 runners are scarce (Natron CI policy): start only once Linux and Windows have
    # passed. Merging only requires Linux and Windows; macOS also builds nightly.
    needs: [changes, linux, windows]
    # on the nightly and on-demand runs (which also build the variants), macOS builds even if a
    # Linux/Windows variant (debug, C++20) failed. !cancelled(), not always(): a cancelled run
    # (superseded by a newer push) must also stop a running macOS job.
    if: >-
      !cancelled() && needs.changes.outputs.run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (needs.linux.result == 'success' && needs.windows.result == 'success'))
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # Apple clang (the system compiler, pinned to /usr/bin so that a MacPorts clang_select can't
      # take over clang++) with the MacPorts libraries found through MacPorts' pkg-config, and
      # MacPorts' cmake and ninja. MacPorts LLVM/clang is not used to build on macOS.
      CMAKE_ARGS: -G Ninja -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DGMIC_DOWNLOAD_DIR=${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the only dependency cache on macOS: setup-macports caches the MacPorts installation
      # (the G'MIC sources are downloaded on each run)
      - name: Install MacPorts and dependencies
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      # OFX_DEPLOY_BUNDLES: the install step copies the MacPorts libraries into the bundle
      # (osxDeploy.sh), as the Makefile's release builds do
      - name: Build (release, OpenMP)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_DEPLOY_BUNDLES=ON
          cmake --build build -j4
      - name: Describe all plug-ins
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-debug $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17
          cmake --build build-debug -j4
      - name: Install bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake --install build --prefix Bundle
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-macos-release
          path: Bundle/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-cxx20 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          cmake --build build-cxx20 -j4
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fftw mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-expat
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: gmic_*.tar.gz
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP)
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")"
          cmake --build build -j4
      - name: Describe all plug-ins
        run: |
          set -eo pipefail
          .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          set -eo pipefail
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17
          cmake --build build-debug -j4
      - name: Collect bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        run: |
          set -eo pipefail
          mkdir -p Bundle
          cp -R build/Plugins/GMIC.ofx.bundle Bundle/
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-windows-release
          path: Bundle/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          set -eo pipefail
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          cmake --build build-cxx20 -j4
          .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT
