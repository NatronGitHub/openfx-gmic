name: Continuous Integration

# Natron CI policy: per PR/push, exactly three full builds plus tests (macOS 15 arm64 with the
# system clang and MacPorts libraries, Ubuntu 24.04, Windows x64 with MSVC). Extra variants (debug
# builds, a C++20 build, an MSYS2 UCRT64 Windows build, Windows on Arm: MSVC ARM64 and Arm64X on
# windows-11-arm) run weekly or on demand; the per-PR builds use C++17 (Natron RB-2.6 policy: Qt5
# builds C++17, Qt6 builds C++20); build artifacts are uploaded only on demand or for pre-release
# tags, and the Windows bundle (x64 + Arm, merged) also weekly. On demand, "only: windows-arm" runs just
# the Windows on Arm job (gh workflow run ci.yml -f only=windows-arm).
#
# CI builds with CMake (NatronGitHub/Natron#1181), as Natron's build-plugins.sh does by default.
# The top-level Makefile is a fallback (build-plugins.sh's PLUGINS_BUILD_SYSTEM=make), kept tested
# by one weekly Linux release build whose bundle and sources are compared with the CMake ones
# (compare_bundles.sh, compare_sources.sh). Not tested: the Makefile's debug, macOS and Windows
# builds. COMMERCIAL builds (LICENSE=COMMERCIAL, -DOFX_LICENSE=COMMERCIAL) are not CI-tested at
# all (low priority). CMakeLists.txt also reads GMICVER, the checksums, POCKETFFTCOMMIT,
# CIMG_PATCHES and GMIC_PATCHES from the Makefile, hence the cache keys on hashFiles('Makefile').
#
# FFT: all builds use the default, pocketfft (header-only, downloaded), as Natron's builds do; each
# checks that its bundle doesn't link FFTW (check_fft.sh), and Linux renders FFT filters on a
# non-power-of-two image (fft_smoke.sh). The weekly and on-demand runs also build FFT=fftw3 (FFTW,
# opt-in for GPL builds) on Linux and macOS, check that it links FFTW, and describe and render it
# (the pr subset, with the FFT filters).
#
# Render test (render_plugins.py, with openfx's hostDemo: GMIC_BUILD_TESTS=ON): per PR, a
# representative subset of the plug-ins (the FFT and multi-layer filters, every 30th plug-in) on
# the three systems; weekly and on demand, all the plug-ins on Linux. Linux also renders the pr
# subset with hostDemo --ofx14 (an OFX 1.4-only host: the plug-ins must work in OFX 1.4 hosts).
#
# Linux dependencies: GMIC.ofx may need only system libraries (glibc's, libstdc++, libgcc_s,
# libgomp): no libcurl, static zlib and libpng (see GMIC_OFX/Makefile). Each Linux build checks it
# with openfx's linuxCheckBundle.sh on the installed bundle (Ubuntu builds: with Ubuntu 24.04's
# glibc and libstdc++ versions as the limits; GMIC_STATIC_DEPS=OFF: shared zlib and libpng
# allowed) and with
# check_linux_deps.sh (what linuxCheckBundle.sh doesn't check); the weekly and on-demand runs also
# build with CMake on Rocky Linux 9 (GCC 11, glibc 2.34), Natron 2.6's Linux baseline, checked
# with linuxCheckBundle.sh's defaults (EL9).
#
# Downloads: no libcurl on any system (macOS checks it with check_no_libcurl.sh, Windows with the
# list of DLLs that GMIC.ofx may import): G'MIC
# downloads filter data with the system's curl command (macOS /usr/bin/curl, Windows System32's
# curl.exe, Linux curl or wget from PATH; see gmic_plugin_call.cpp). The weekly and on-demand runs
# render Add Grain on the three systems, which downloads its grain images that way (gmic.eu may
# refuse downloads).
#
# Frugal CI (the NatronGitHub runners are shared by all repos): one run per change. Pushes run CI
# only on master and tags; feature branches run through their pull request. Draft pull requests
# run Linux and Windows; macOS waits until the PR is ready (marking it ready starts a new run).
# Superseded runs are cancelled, except for tags. The weekly run is never skipped:
# the toolchains (package managers, runner images) move even when master doesn't. Jobs time out.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all: every job; windows-arm: only the Windows ARM64/Arm64EC/Arm64X job"
        type: choice
        options: [ all, windows-arm ]
        default: all
  schedule:
    - cron: '17 3 * * 6' # weekly, Saturday 03:17 UTC: also builds the variants (debug, C++20)
  # pushes to master (and tags) only: pull requests are built by the pull_request trigger,
  # so that each PR push is not built twice
  push:
    branches: [ master ]
    tags: [ '*' ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'

# One group per event type and PR number (branch names can collide across forks) or ref (master,
# tags): a new run cancels the superseded one, except for tags. The event type keeps a master push
# from cancelling the weekly or on-demand run, which also builds the variants.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # number of plug-ins expected from the pinned G'MIC version: update when upgrading G'MIC
  GMIC_PLUGIN_COUNT: 1202
  # of them, those that run their preview command before their main command (#206; read by
  # describe_plugins.sh): update when upgrading G'MIC or changing the rule (Helpers/gmic_parser.cpp)
  PREVIEW_FIRST_COUNT: 10
  # extra variants (debug, C++20) only on the weekly schedule or on demand
  BUILD_VARIANTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # artifacts only on demand or for pre-release tags (containing "alpha", "beta" or "rc", e.g.
  # Natron-2.6.0-rc1; contains() is case-insensitive)
  UPLOAD_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc'))) }}

jobs:
  # Which jobs run: every pull request, drafts included (macOS only once ready); "only:
  # windows-arm" (workflow_dispatch) runs just the Windows on Arm job. The weekly scheduled run is
  # never skipped: the toolchains (package managers, runner images) move even when master doesn't.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      # the Windows ARM64/Arm64EC/Arm64X job: weekly and on demand only
      arm: ${{ steps.check.outputs.arm }}
    steps:
      - id: check
        run: |
          run=true
          arm=false
          case "${{ github.event_name }}" in schedule|workflow_dispatch) arm=$run;; esac
          if [ "${{ inputs.only }}" = windows-arm ]; then run=false; arm=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "arm=$arm" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # the weekly and on-demand runs render all the plug-ins
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # linuxCheckBundle.sh: the Ubuntu 24.04 bundles need its glibc and libstdc++; the
      # EL9 limits (the defaults) are checked on Rocky Linux 9 (linux-rocky9)
      OFX_ABI_GLIBC: '2.39'
      OFX_ABI_GLIBCXX: '3.4.33'
      OFX_ABI_CXXABI: '1.3.15'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config zlib1g-dev libpng-dev libexpat1-dev \
            libgl-dev
      # the tarball and pocketfft_hdronly.h, downloaded into the source directory (GMIC_DOWNLOAD_DIR,
      # GMIC_POCKETFFT), where the CMake build finds them; the key hashes the Makefile, which pins
      # both (GMICVER, POCKETFFTCOMMIT, read by CMakeLists.txt)
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: |
            gmic_*.tar.gz
            pocketfft_hdronly.h
          key: gmic-src-${{ hashFiles('Makefile') }}
      # static zlib and libpng built with -fPIC, linked into GMIC.ofx (GMIC_STATIC_DEPS)
      - uses: ./.github/actions/static-deps
      - name: Build (release, OpenMP)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DGMIC_POCKETFFT="$PWD/pocketfft_hdronly.h" -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          .github/workflows/check_fft.sh install/OFX/Plugins/GMIC.ofx.bundle pocketfft
          openfx/Support/include/linuxCheckBundle.sh install/OFX/Plugins
          .github/workflows/check_linux_deps.sh install/OFX/Plugins/GMIC.ofx.bundle
      # the tests run on the installed bundle, the one that is shipped (see "Upload bundle")
      - name: Describe all plug-ins
        run: DESCRIBE_USER_LIST=1 DESCRIBE_UPDATE_FILE=1 PLUGIN_LIST=plugins.txt .github/workflows/describe_plugins.sh install/OFX/Plugins $GMIC_PLUGIN_COUNT
      # the default FFT (pocketfft) on a non-power-of-two image, with an interpreter built from the
      # same sources
      - name: Render FFT filters (720x576)
        run: .github/workflows/fft_smoke.sh build/gmic
      # all the plug-ins on the weekly and on-demand runs, a subset per PR
      - name: Render plug-ins
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset "$([ "$BUILD_VARIANTS" = true ] && echo all || echo pr)" --jobs 2
      # an OFX 1.4-only host (hostDemo --ofx14, openfx#170): only the OFX 1.4 host properties and
      # suites. Without OMP_NUM_THREADS (--host-threads), the plug-in sets G'MIC's thread count
      # (#188): hostDemo's multithread suite reports 1 CPU, and each hostDemo process runs one
      # render, so the fair share gives it all the hardware threads. Baseline: this step on master,
      # with OMP_NUM_THREADS=2, took about 65 s
      - name: Render plug-ins (subset, OFX 1.4 host)
        run: |
          python3 .github/workflows/render_plugins.py --host build --host-arg=--ofx14 --host-threads \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2 --work render-ofx14
      # a user filter file (~/.config/gmic/gmic_ofx.gmic) whose filters call the commands it
      # defines, and replace a built-in one (#168): checks the pixels and the hot-fix notes, and
      # prints the render times with a small file and with a copy of the standard library
      - name: Render filters of a user filter file
        run: |
          python3 .github/workflows/user_filters_test.py --host build --plugins install/OFX/Plugins \
            --stdlib build/gmic/gmic_stdlib_community.h --work render-user-file
      # the same file as G'MIC's filter update file (~/.config/gmic/update408.gmic, read with
      # OFX_GMIC_UPDATE_FILE=1, #180)
      - name: Render filters of a G'MIC update file
        run: |
          python3 .github/workflows/user_filters_test.py --host build --plugins install/OFX/Plugins \
            --update-file --runs 1 --work render-update-file
      # the same file as the user source (~/.gmic), read after the built-in filters (#206)
      - name: Render filters of a user source
        run: |
          python3 .github/workflows/user_filters_test.py --host build --plugins install/OFX/Plugins \
            --user-source --runs 1 --work render-user-source
      # no libcurl: G'MIC downloads with the curl command (cimg::load_network). Add Grain
      # downloads its grain images (gmic_grain.gmz, from gmic.eu) into G'MIC's cache, here an empty
      # GMIC_CACHE_PATH (Color Presets downloads only for a preset other than the default).
      # OFX_GMIC_TEST_CURL_ONLY (gmic_plugin_call.cpp): no wget or PowerShell fallback, so the
      # download succeeds only through the curl command
      - name: Download filter data with the curl command (Add Grain)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gmic-cache"
          OFX_GMIC_TEST_CURL_ONLY=1 GMIC_CACHE_PATH="$RUNNER_TEMP/gmic-cache/" python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --only eu.gmic.AddGrain --work render-download
          find "$RUNNER_TEMP/gmic-cache" -name 'gmic_grain*' -size +0 -exec ls -l {} + | grep . ||
            { echo "FAIL: gmic_grain.gmz was not downloaded"; exit 1; }
      # FFTW (opt-in, GPL builds only), rendered with the hostDemo of the default build; before the
      # Makefile build, whose (pocketfft) G'MIC headers in the checkout would stop CMake's FFT=fftw3
      # configure (CMakeLists.txt refuses headers that are not the build's own)
      - name: Build, describe and render (release, FFT=fftw3)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          sudo apt-get install -y libfftw3-dev
          cmake -S . -B build-fftw3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DFFT=fftw3
          cmake --build build-fftw3 -j4
          cmake --install build-fftw3 --prefix install-fftw3
          .github/workflows/check_fft.sh install-fftw3/OFX/Plugins/GMIC.ofx.bundle fftw3
          openfx/Support/include/linuxCheckBundle.sh install-fftw3/OFX/Plugins
          .github/workflows/check_linux_deps.sh install-fftw3/OFX/Plugins/GMIC.ofx.bundle
          PLUGIN_LIST=plugins-fftw3.txt .github/workflows/describe_plugins.sh install-fftw3/OFX/Plugins $GMIC_PLUGIN_COUNT
          python3 .github/workflows/render_plugins.py --host build \
            --plugins install-fftw3/OFX/Plugins --list plugins-fftw3.txt --stdlib build-fftw3/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      # GMIC_STATIC_DEPS=OFF, as Natron's release builds (whose SDK has only shared zlib and libpng,
      # which the installer bundles) and distribution packages do: the system's shared zlib and
      # libpng (without the static-deps prefix of PKG_CONFIG_PATH), still no libcurl or FFTW.
      # Before the Makefile build, as FFT=fftw3 above.
      - name: Build and describe (release, GMIC_STATIC_DEPS=OFF)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          env -u PKG_CONFIG_PATH cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 \
            -DGMIC_DOWNLOAD_DIR="$PWD" -DGMIC_POCKETFFT="$PWD/pocketfft_hdronly.h" -DGMIC_STATIC_DEPS=OFF
          cmake --build build-shared -j4
          cmake --install build-shared --prefix install-shared
          .github/workflows/check_fft.sh install-shared/OFX/Plugins/GMIC.ofx.bundle pocketfft
          # the shared zlib and libpng may come from the system (or Natron's installer bundles them);
          # any other non-system library must be bundled
          OFX_ABI_OPTIONAL_LIBS="libz.so.1 libpng16.so.16" openfx/Support/include/linuxCheckBundle.sh install-shared/OFX/Plugins
          SHARED_DEPS=1 .github/workflows/check_linux_deps.sh install-shared/OFX/Plugins/GMIC.ofx.bundle
          readelf -d install-shared/OFX/Plugins/GMIC.ofx.bundle/Contents/Linux-x86-64/GMIC.ofx | grep -q 'NEEDED.*libpng16\.so' ||
            { echo "FAIL: GMIC_STATIC_DEPS=OFF does not link the shared libpng"; exit 1; }
          .github/workflows/describe_plugins.sh install-shared/OFX/Plugins $GMIC_PLUGIN_COUNT
      # debug build (CMAKE_BUILD_TYPE=Debug), described; before the Makefile build, as above
      - name: Build and describe (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DGMIC_POCKETFFT="$PWD/pocketfft_hdronly.h"
          cmake --build build-debug -j4
          cmake --install build-debug --prefix install-debug
          .github/workflows/check_linux_deps.sh install-debug/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/describe_plugins.sh install-debug/OFX/Plugins $GMIC_PLUGIN_COUNT
      # The installed Linux bundle is uploaded as is, the one that linuxCheckBundle.sh and
      # check_linux_deps.sh checked: it needs only system libraries, but the glibc and libstdc++ of
      # Ubuntu 24.04. Natron's Linux releases build the plug-in on Rocky Linux 9, Natron 2.6's Linux
      # baseline (see the linux-rocky9 job).
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-linux-release
          path: install/OFX/Plugins/GMIC.ofx.bundle
      # before the Makefile build, as above
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DGMIC_DOWNLOAD_DIR="$PWD"
          cmake --build build-cxx20 -j4
          cmake --install build-cxx20 --prefix install-cxx20
          .github/workflows/check_linux_deps.sh install-cxx20/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/describe_plugins.sh install-cxx20/OFX/Plugins $GMIC_PLUGIN_COUNT
      # the Makefile fallback of Natron's build-plugins.sh (PLUGINS_BUILD_SYSTEM=make), release, as
      # its fallback builds it; its bundle and G'MIC sources are compared with the CMake release
      # build's (installed). Last: its G'MIC headers in the checkout would stop CMake configures.
      - name: Build with the Makefile (release), compare with CMake
        if: env.BUILD_VARIANTS == 'true'
        run: |
          make -j4 CONFIG=release OPENMP=1 CXXSTD=c++17
          openfx/Support/include/linuxCheckBundle.sh GMIC_OFX/Linux-64-release/GMIC.ofx.bundle
          .github/workflows/check_linux_deps.sh GMIC_OFX/Linux-64-release/GMIC.ofx.bundle
          .github/workflows/compare_bundles.sh GMIC_OFX/Linux-64-release/GMIC.ofx.bundle install/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/compare_sources.sh build

  # Natron 2.6's Linux baseline, weekly or on demand: Rocky Linux 9 (GCC 11, glibc 2.34; VFX
  # Reference Platform CY2027), with CMake (EL9's cmake; the Unix Makefiles generator, since
  # ninja-build is only in the CRB repository), as Natron's build-plugins.sh does. The plug-in must
  # need only system libraries and the symbol versions of EL9 (linuxCheckBundle.sh's defaults:
  # glibc 2.34, GCC 11's libstdc++), and check_linux_deps.sh; the describe test and the render test
  # (the pr subset) run there.
  linux-rocky9:
    name: Linux (Rocky Linux 9, GCC 11)
    runs-on: ubuntu-24.04
    container: rockylinux:9
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      # git before the checkout, for the submodule; make for build_static_deps.sh and CMake's Unix
      # Makefiles generator
      - name: Install packages
        run: |
          dnf install -y git gcc-c++ make cmake pkgconf-pkg-config expat-devel perl binutils diffutils \
            findutils which xz tar gzip python3
          gcc --version | sed -n 1p; ldd --version | sed -n 1p; cmake --version | sed -n 1p
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: |
            gmic_*.tar.gz
            pocketfft_hdronly.h
          key: gmic-src-${{ hashFiles('Makefile') }}
      # static zlib and libpng built with -fPIC, linked into GMIC.ofx (GMIC_STATIC_DEPS)
      - uses: ./.github/actions/static-deps
      - name: Build (release, OpenMP, C++17)
        run: |
          git config --global --add safe.directory "$PWD"
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DGMIC_POCKETFFT="$PWD/pocketfft_hdronly.h" -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          .github/workflows/check_fft.sh build/Plugins/GMIC.ofx.bundle pocketfft
          openfx/Support/include/linuxCheckBundle.sh install/OFX/Plugins
          .github/workflows/check_linux_deps.sh install/OFX/Plugins/GMIC.ofx.bundle
      - name: Describe all plug-ins
        run: DESCRIBE_USER_LIST=1 DESCRIBE_UPDATE_FILE=1 PLUGIN_LIST=plugins.txt CXX=g++ .github/workflows/describe_plugins.sh install/OFX/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2

  macos:
    name: macOS 15 arm64 (Apple clang, MacPorts libraries)
    runs-on: macos-15
    # macOS arm64 runners are scarce (Natron CI policy): start only once Linux and Windows have
    # passed, and not on draft PRs. Merging only requires Linux and Windows; macOS also builds weekly.
    needs: [changes, linux, windows]
    # on the weekly and on-demand runs (which also build the variants), macOS builds even if a
    # Linux/Windows variant (debug, C++20) failed. !cancelled(), not always(): a cancelled run
    # (superseded by a newer push) must also stop a running macOS job.
    if: >-
      !cancelled() && needs.changes.outputs.run == 'true' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (needs.linux.result == 'success' && needs.windows.result == 'success'))
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # Apple clang (the system compiler, pinned to /usr/bin so that a MacPorts clang_select can't
      # take over clang++) with the MacPorts libraries found through MacPorts' pkg-config, and
      # MacPorts' cmake and ninja. MacPorts LLVM/clang is not used to build on macOS.
      CMAKE_ARGS: -G Ninja -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DGMIC_DOWNLOAD_DIR=${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the only dependency cache on macOS: setup-macports caches the MacPorts installation
      # (the G'MIC sources are downloaded on each run)
      - name: Install MacPorts and dependencies
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      # CI builds aren't shipped: they target the runner's macOS (all openfx* repos), as the MacPorts
      # binary archives do. Set after the MacPorts install, so that it never reaches port builds
      # (the later fftw-3 install runs through sudo and port, which both drop it).
      # check_macos_minos.sh compares against it. Release bundles (Natron's, built on macOS 14)
      # target 14.0, CMakeLists.txt's default, checked by the configure below.
      - name: Deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      # OFX_DEPLOY_BUNDLES: the install step copies the MacPorts libraries into the bundle
      # (osxDeploy.sh) and signs it; the describe test runs on
      # the installed bundle, so that the deployment is tested on each PR
      - name: Build and install (release, OpenMP)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_DEPLOY_BUNDLES=ON \
            -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          codesign --verify --strict install/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/check_fft.sh install/OFX/Plugins/GMIC.ofx.bundle pocketfft
          .github/workflows/check_no_libcurl.sh install/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/check_macos_minos.sh install/OFX/Plugins/GMIC.ofx.bundle
          # release builds: without MACOSX_DEPLOYMENT_TARGET, CMakeLists.txt defaults to 14.0
          env -u MACOSX_DEPLOYMENT_TARGET cmake -S . -B build-target14 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release
          grep -q '^CMAKE_OSX_DEPLOYMENT_TARGET:STRING=14.0$' build-target14/CMakeCache.txt
      - name: Describe all plug-ins
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib DESCRIBE_USER_LIST=1 DESCRIBE_UPDATE_FILE=1 PLUGIN_LIST=plugins.txt \
            .github/workflows/describe_plugins.sh install/OFX/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      # with /usr/bin/curl (see the Linux job)
      - name: Download filter data with the curl command (Add Grain)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gmic-cache"
          OFX_GMIC_TEST_CURL_ONLY=1 GMIC_CACHE_PATH="$RUNNER_TEMP/gmic-cache/" python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --only eu.gmic.AddGrain --work render-download
          find "$RUNNER_TEMP/gmic-cache" -name 'gmic_grain*' -size +0 -exec ls -l {} + | grep . ||
            { echo "FAIL: gmic_grain.gmz was not downloaded"; exit 1; }
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-debug $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17
          cmake --build build-debug -j4
      # FFTW (opt-in, GPL builds only; MacPorts' fftw-3, installed here only), rendered with the
      # hostDemo of the default build
      - name: Build, describe and render (release, FFT=fftw3)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          sudo port -N install fftw-3 -gfortran
          cmake -S . -B build-fftw3 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DFFT=fftw3
          cmake --build build-fftw3 -j4
          .github/workflows/check_fft.sh build-fftw3/Plugins/GMIC.ofx.bundle fftw3
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib PLUGIN_LIST=plugins-fftw3.txt \
            .github/workflows/describe_plugins.sh build-fftw3/Plugins $GMIC_PLUGIN_COUNT
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build-fftw3/Plugins --list plugins-fftw3.txt --stdlib build-fftw3/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      # self-contained artifact (on a copy, the install directory is left as is): the install
      # step's osxDeploy.sh (OFX_DEPLOY_BUNDLES) already copied the MacPorts dylibs into
      # Contents/Libraries; bundle_libs.sh copies any that's missing, removes the rpaths into
      # /opt/local, signs the bundle ad hoc, and fails if a dependency is neither a system library
      # nor bundled. Like the bundled MacPorts dylibs, GMIC.ofx targets the runner's macOS (15 on
      # macos-15; see the Deployment target step), so the artifact needs that macOS or newer
      # (Natron's release builds, built on macOS 14, target 14.0). It must be unquarantined after
      # download (xattr -dr com.apple.quarantine GMIC.ofx.bundle); see the header of bundle_libs.sh.
      - name: Bundle libraries
        if: env.UPLOAD_ARTIFACTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          rm -rf Bundle && mkdir Bundle
          cp -R install/OFX/Plugins/GMIC.ofx.bundle Bundle/
          .github/workflows/bundle_libs.sh Bundle/GMIC.ofx.bundle
          .github/workflows/check_no_libcurl.sh Bundle/GMIC.ofx.bundle
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh Bundle $GMIC_PLUGIN_COUNT
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-macos-release
          path: Bundle/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-cxx20 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          cmake --build build-cxx20 -j4
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT

  # Windows x64 with MSVC (Visual Studio's cl.exe, Ninja, from Git for Windows' bash, whose sh and awk
  # apply the patches): static zlib, libpng (and expat, for the test hosts) from vcpkg's
  # x64-windows-static triplet, pinned by vcpkg.json's builtin-baseline, and the static C runtime
  # (/MT). OpenMP is MSVC's /openmp: the bundle ships the redistributable vcomp140.dll next to
  # GMIC.ofx. GMIC.ofx may only import KERNEL32, SHELL32 and VCOMP140.
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2025
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # the runner image and MSVC version are part of the key (vcpkg's ABI hashes include the
      # compiler, so an older cache from the prefix is still safe to restore)
      - name: Toolchain id
        id: toolchain
        run: echo "id=$ImageOS-$ImageVersion-msvc$VCToolsVersion" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ steps.toolchain.outputs.id }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: |
            gmic_*.tar.gz
            pocketfft_hdronly.h
          key: gmic-src-${{ hashFiles('Makefile') }}
      # the runner's vcpkg (VCPKG_INSTALLATION_ROOT) must have vcpkg.json's baseline commit
      - name: vcpkg
        run: |
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          if ! git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          fi
          git -C "$VCPKG_INSTALLATION_ROOT" log -1 --format='vcpkg baseline: %h %cs %s' "$baseline"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -w "$RUNNER_TEMP/vcpkg-cache"),readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_TOOLCHAIN=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build (release, OpenMP)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET \
            -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h" \
            -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          find install -type f | sort
      # The DLLs that GMIC.ofx imports (no C++ runtime, zlib, libpng, FFTW or libcurl DLL), the
      # redistributable vcomp140.dll next to it, listed in GMIC.ofx's embedded manifest, and
      # actually loaded from there (by a process that also finds System32's copy)
      - name: Check the bundle's dependencies
        run: |
          dir=install/OFX/Plugins/GMIC.ofx.bundle/Contents/Win64
          ofx=$dir/GMIC.ofx
          deps=$(MSYS2_ARG_CONV_EXCL='*' dumpbin -nologo -dependents "$(cygpath -w "$ofx")" |
                 sed -n '/has the following dependencies/,/Summary/p' | grep -iE '^ +[^ ]+\.dll$' | tr -d ' \r' | tr 'a-z' 'A-Z' | sort | tr '\n' ' ')
          echo "GMIC.ofx imports: $deps"
          [ "$deps" = "KERNEL32.DLL SHELL32.DLL VCOMP140.DLL " ] ||
            { echo "FAIL: GMIC.ofx must import only KERNEL32, SHELL32 and VCOMP140"; exit 1; }
          ls -l "$dir"
          [ "$(ls "$dir" | tr '\n' ' ')" = "GMIC.ofx vcomp140.dll " ] ||
            { echo "FAIL: Contents/Win64 must have GMIC.ofx and vcomp140.dll only"; exit 1; }
          MSYS2_ARG_CONV_EXCL='*' mt -nologo "-inputresource:$(cygpath -w "$ofx");#2" -out:GMIC.ofx.manifest
          cat GMIC.ofx.manifest; echo
          grep -q 'file name="vcomp140.dll"' GMIC.ofx.manifest || { echo "FAIL: no vcomp140.dll in the manifest"; exit 1; }
          cat install/OFX/Plugins/GMIC.ofx.bundle/Contents/Resources/vcomp140-NOTICE.txt ||
            { echo "FAIL: no vcomp140-NOTICE.txt in Contents/Resources"; exit 1; }
      - name: Check that vcomp140.dll is loaded from the bundle
        shell: pwsh
        run: |
          $dir = (Resolve-Path install/OFX/Plugins/GMIC.ofx.bundle/Contents/Win64).Path
          (Get-Item "$dir\vcomp140.dll").VersionInfo | Format-List FileDescription,FileVersion,ProductVersion
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern System.IntPtr LoadLibraryW(string f);'
          if ([W.K]::LoadLibraryW("$dir\GMIC.ofx") -eq [System.IntPtr]::Zero) { throw "LoadLibrary failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $vcomp = (Get-Process -Id $PID).Modules | Where-Object ModuleName -ieq 'vcomp140.dll'
          Write-Host "vcomp140.dll loaded from: $($vcomp.FileName)"
          if ($vcomp.FileName -ine "$dir\vcomp140.dll") { throw "vcomp140.dll is not the bundle's" }
      - name: Describe all plug-ins
        run: |
          export DESCRIBE_MSVC_EXPAT_LIB=$(ls build/vcpkg_installed/$VCPKG_TRIPLET/lib/libexpat*MT.lib | head -1)
          export DESCRIBE_MSVC_CFLAGS="-I$(cygpath -m "$PWD/build/vcpkg_installed/$VCPKG_TRIPLET/include")"
          DESCRIBE_USER_LIST=1 DESCRIBE_UPDATE_FILE=1 PLUGIN_LIST=plugins.txt .github/workflows/describe_plugins.sh install/OFX/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          python .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      # Windows' own curl.exe (System32), which the plug-in runs: its version and features, and the
      # command line of CImg's cimg::load_network() (with and without --compressed: a curl.exe
      # without libz refuses it, and CImg then falls back to PowerShell), on gmic.eu's gmic_grain.gmz
      - name: System curl.exe (diagnostic)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          curl_exe="$(cygpath -u "$SYSTEMROOT")/System32/curl.exe"
          "$curl_exe" -V
          for opt in --compressed ""; do
            rm -f curl-test.gmz
            rc=0
            "$curl_exe" -L --max-redirs 20 -A "CImg" -f --silent $opt -o curl-test.gmz \
              "https://gmic.eu/gmic_grain.gmz" || rc=$?
            echo "curl.exe ${opt:-(no --compressed)}: exit status $rc, $(wc -c < curl-test.gmz 2>/dev/null || echo 0) bytes"
          done
          rm -f curl-test.gmz
      # with System32's curl.exe (see the Linux job)
      - name: Download filter data with the curl command (Add Grain)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cache="$(cygpath -u "$RUNNER_TEMP")/gmic-cache"
          mkdir -p "$cache"
          OFX_GMIC_TEST_CURL_ONLY=1 GMIC_CACHE_PATH="$(cygpath -m "$cache")/" python .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --only eu.gmic.AddGrain --work render-download
          find "$cache" -name 'gmic_grain*' -size +0 -exec ls -l {} + | grep . ||
            { echo "FAIL: gmic_grain.gmz was not downloaded"; exit 1; }
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET \
            -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h"
          cmake --build build-debug -j4
          # Debug builds link the release OpenMP runtime (vcomp140.dll, bundled), not vcomp140d.dll
          deps=$(MSYS2_ARG_CONV_EXCL='*' dumpbin -nologo -dependents "$(cygpath -w build-debug/Plugins/GMIC.ofx.bundle/Contents/Win64/GMIC.ofx)" |
                 sed -n '/has the following dependencies/,/Summary/p' | grep -iE '^ +[^ ]+\.dll$' | tr -d ' \r' | tr 'a-z' 'A-Z' | sort | tr '\n' ' ')
          echo "GMIC.ofx (debug) imports: $deps"
          [ "$deps" = "KERNEL32.DLL SHELL32.DLL VCOMP140.DLL " ] ||
            { echo "FAIL: the debug GMIC.ofx must import only KERNEL32, SHELL32 and VCOMP140"; exit 1; }
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET \
            -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h"
          cmake --build build-cxx20 -j4
          export DESCRIBE_MSVC_EXPAT_LIB=$(ls build/vcpkg_installed/$VCPKG_TRIPLET/lib/libexpat*MT.lib | head -1)
          export DESCRIBE_MSVC_CFLAGS="-I$(cygpath -m "$PWD/build/vcpkg_installed/$VCPKG_TRIPLET/include")"
          .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT
      # the bundle that users download: weekly, on demand and for pre-release tags (on schedule and
      # on demand, through the merged openfx-gmic-windows-msvc bundle, kept for two weeks)
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-windows-x64-msvc
          path: install/OFX/Plugins
          # 1 day weekly and on demand, when the merged openfx-gmic-windows-msvc bundle (below,
          # 14 days) has it; 14 days for pre-release tags, which build no Arm bundle (this one is
          # then the Windows download)
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 14 || 1 }}
          compression-level: 9

  # Weekly and on demand only: MSYS2 UCRT64 (MinGW-w64 GCC, libgomp, pkg-config, CMake), the other
  # way to build on Windows. Built, described and rendered (pr subset); bundle_libs.sh then makes
  # the bundle self-contained, and the describe test runs a
  # statically linked host with a PATH without /ucrt64/bin, so that the plug-in loads only if it
  # finds its DLLs in the bundle (see bundle_libs.sh for its limits). No artifact.
  windows-ucrt64:
    name: Windows (MSYS2 UCRT64, weekly)
    runs-on: windows-2025
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-expat mingw-w64-ucrt-x86_64-python
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: |
            gmic_*.tar.gz
            pocketfft_hdronly.h
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP)
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" \
            -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h" -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          .github/workflows/check_fft.sh build/Plugins/GMIC.ofx.bundle pocketfft
          .github/workflows/check_no_libcurl.sh build/Plugins/GMIC.ofx.bundle
      - name: Describe all plug-ins
        run: |
          set -eo pipefail
          DESCRIBE_USER_LIST=1 DESCRIBE_UPDATE_FILE=1 PLUGIN_LIST=plugins.txt .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          set -eo pipefail
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      - name: Self-contained bundle (bundle_libs.sh), described without /ucrt64/bin
        run: |
          set -eo pipefail
          rm -rf Bundle && mkdir -p Bundle
          cp -R install/OFX/Plugins/GMIC.ofx.bundle Bundle/
          .github/workflows/bundle_libs.sh Bundle/GMIC.ofx.bundle
          .github/workflows/check_no_libcurl.sh Bundle/GMIC.ofx.bundle
          CXX="c++ -DXML_STATIC" HOST_LDFLAGS=-static HOST_RUN_PATH=/c/Windows/System32:/c/Windows \
            .github/workflows/describe_plugins.sh Bundle $GMIC_PLUGIN_COUNT

  # Weekly and on demand only: Windows on Arm with MSVC, built natively on windows-11-arm, as the
  # x64 job (vcpkg static libraries, /MT, /openmp with the bundled vcomp140.dll, which is an Arm64X
  # image there: the same file serves ARM64 and Arm64EC code). Two builds:
  # - ARM64, with vcpkg's arm64-windows-static: Contents/Win-arm64, for native ARM64 hosts (a
  #   reserved folder of the OFX packaging spec); it also writes the Arm64X linker inputs;
  # - Arm64X, an Arm64EC build (overlay triplet vcpkg-triplets/arm64ec-windows-static) linked with
  #   the ARM64 build's objects (Microsoft's two-pass recipe, see CMakeLists.txt):
  #   Contents/Win-arm64ec, the normative folder for Arm64EC hosts and x64 hosts under emulation.
  # The bundle is described and renders the pr subset with an ARM64 host (Win-arm64) and an
  # Arm64EC host (Win-arm64ec), and the Arm64X GMIC.ofx also with the ARM64 host (from a copy in
  # Win-arm64x, where native hosts also look). Uploaded weekly and on demand, for windows-bundle,
  # which merges it with the x64 bundle. A failed render keeps its work directory and the crash
  # dumps of hostDemo.exe (WER LocalDumps) as an artifact.
  windows-arm:
    name: Windows on Arm (MSVC ARM64, Arm64X)
    runs-on: windows-11-arm
    needs: changes
    if: needs.changes.outputs.arm == 'true'
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC (ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Toolchain id
        id: toolchain
        run: echo "id=$ImageOS-$ImageVersion-msvc$VCToolsVersion" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-arm-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/*') }}
          restore-keys: |
            vcpkg-arm-${{ steps.toolchain.outputs.id }}-
            vcpkg-arm-
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: |
            gmic_*.tar.gz
            pocketfft_hdronly.h
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: vcpkg
        run: |
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          if ! git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          fi
          git -C "$VCPKG_INSTALLATION_ROOT" log -1 --format='vcpkg baseline: %h %cs %s' "$baseline"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -w "$RUNNER_TEMP/vcpkg-cache"),readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_TOOLCHAIN=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build ARM64 (and the Arm64X linker inputs)
        run: |
          mkdir -p arm64x
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=arm64-windows-static \
            -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h" \
            -DGMIC_BUILD_TESTS=ON -DGMIC_ARM64X=ARM64 -DGMIC_ARM64X_RSP="$(cygpath -m "$PWD")/arm64x/GMIC.rsp"
          cmake --build build-arm64 -j4
          cmake --install build-arm64 --prefix install-arm64
      # CFLAGS/CXXFLAGS: added to CMake's default flags, which -DCMAKE_CXX_FLAGS would replace
      - name: Build Arm64X (Arm64EC, linked with the ARM64 build's objects)
        run: |
          CFLAGS=-arm64EC CXXFLAGS=-arm64EC cmake -S . -B build-arm64x -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=arm64ec-windows-static \
            -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" -DGMIC_POCKETFFT="$(cygpath -m "$PWD")/pocketfft_hdronly.h" \
            -DGMIC_BUILD_TESTS=ON -DGMIC_ARM64X=ARM64EC -DGMIC_ARM64X_RSP="$(cygpath -m "$PWD")/arm64x/GMIC.rsp"
          cmake --build build-arm64x -j4
          cmake --install build-arm64x --prefix install-arm64x
      # one bundle: Win-arm64ec (Arm64X) and Win-arm64 (ARM64)
      - name: Assemble and check the bundle
        run: |
          rm -rf bundle-arm && mkdir -p bundle-arm
          cp -R install-arm64x/OFX/Plugins/GMIC.ofx.bundle bundle-arm/
          cp -R install-arm64/OFX/Plugins/GMIC.ofx.bundle/Contents/Win-arm64 bundle-arm/GMIC.ofx.bundle/Contents/
          find bundle-arm -type f -exec ls -l {} \; | awk '{print $5, $9}'
          for a in Win-arm64ec:ARM64X Win-arm64:ARM64; do
            dir=bundle-arm/GMIC.ofx.bundle/Contents/${a%%:*} want=${a##*:}
            [ "$(ls "$dir" | tr '\n' ' ')" = "GMIC.ofx vcomp140.dll " ] || { echo "FAIL: $dir must have GMIC.ofx and vcomp140.dll only"; exit 1; }
            w=$(cygpath -w "$dir/GMIC.ofx")
            deps=$(MSYS2_ARG_CONV_EXCL='*' dumpbin -nologo -dependents "$w" | sed -n '/has the following dependencies/,/Summary/p' |
                   grep -iE '^ +[^ ]+\.dll$' | tr -d ' \r' | tr 'a-z' 'A-Z' | sort | tr '\n' ' ')
            machine=$(MSYS2_ARG_CONV_EXCL='*' dumpbin -nologo -headers "$w" | grep -m1 ' machine ' | tr -d '\r' | sed 's/^ *//; s/ *$//')
            echo "$dir/GMIC.ofx: $machine; imports $deps"
            [ "$deps" = "KERNEL32.DLL SHELL32.DLL VCOMP140.DLL " ] || { echo "FAIL: GMIC.ofx must import only KERNEL32, SHELL32 and VCOMP140"; exit 1; }
            case $want in
              ARM64X) echo "$machine" | grep -q 'AA64 machine (ARM64) (ARM64X)' ;;
              ARM64) echo "$machine" | grep -q 'AA64 machine (ARM64)$' ;;
            esac || { echo "FAIL: $dir/GMIC.ofx is not $want"; exit 1; }
            # vcomp140.dll must serve both kinds of code: the ARM64 Redist copy is an Arm64X image
            MSYS2_ARG_CONV_EXCL='*' dumpbin -nologo -headers "$(cygpath -w "$dir/vcomp140.dll")" | grep -q 'AA64 machine (ARM64) (ARM64X)' ||
              { echo "FAIL: $dir/vcomp140.dll is not Arm64X"; exit 1; }
            MSYS2_ARG_CONV_EXCL='*' mt -nologo "-inputresource:$w;#2" -out:GMIC.ofx.manifest
            grep -q 'file name="vcomp140.dll"' GMIC.ofx.manifest || { echo "FAIL: no vcomp140.dll in $dir's manifest"; exit 1; }
          done
          cat bundle-arm/GMIC.ofx.bundle/Contents/Resources/vcomp140-NOTICE.txt
      # (native ARM64 PowerShell, which loads ARM64 and Arm64X DLLs; one process per DLL)
      - name: Check that vcomp140.dll is loaded from the bundle (ARM64 process)
        shell: pwsh
        run: |
          foreach ($a in @('Win-arm64', 'Win-arm64ec')) {
            $dir = (Resolve-Path "bundle-arm/GMIC.ofx.bundle/Contents/$a").Path
            pwsh -NoProfile -Command {
              param($dir)
              Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern System.IntPtr LoadLibraryW(string f);'
              if ([W.K]::LoadLibraryW("$dir\GMIC.ofx") -eq [System.IntPtr]::Zero) { throw "LoadLibrary failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
              $v = (Get-Process -Id $PID).Modules | Where-Object ModuleName -ieq 'vcomp140.dll'
              Write-Host "$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture) process, $dir\GMIC.ofx: vcomp140.dll from $($v.FileName)"
              if ($v.FileName -ine "$dir\vcomp140.dll") { throw "vcomp140.dll is not the bundle's" }
            } -args $dir
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Crash dumps of hostDemo.exe (WER LocalDumps)
        shell: pwsh
        run: |
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\hostDemo.exe'
          New-Item -Force $k | Out-Null
          New-ItemProperty -Force -Path $k -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
          New-ItemProperty -Force -Path $k -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force -Path $k -Name DumpCount -PropertyType DWord -Value 10 | Out-Null
          # (the runner image disables WER: no dumps were written in earlier runs)
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-ItemProperty -Force -Path $wer -Name Disabled -PropertyType DWord -Value 0 | Out-Null
          New-ItemProperty -Force -Path $wer -Name DontShowUI -PropertyType DWord -Value 1 | Out-Null
          Set-Service WerSvc -StartupType Manual
          Start-Service WerSvc
          Get-Service WerSvc | Format-List Name,Status,StartType
      - name: Describe and render (pr subset)
        run: |
          test_one() { # <name> <host build> <plug-in dir> <vcpkg triplet> <cflags> <ldflags>
            n=$1 host=$2 plugins=$3 trip=$4
            echo "::group::$n"
            DESCRIBE_MSVC_EXPAT_LIB=$(ls $host/vcpkg_installed/$trip/lib/libexpat*MT.lib | head -1) \
            DESCRIBE_MSVC_CFLAGS="$5 -I$(cygpath -m "$PWD/$host/vcpkg_installed/$trip/include")" DESCRIBE_MSVC_LDFLAGS="$6" \
            PLUGIN_LIST=plugins-$n.txt .github/workflows/describe_plugins.sh "$plugins" $GMIC_PLUGIN_COUNT
            python .github/workflows/render_plugins.py --host $host --plugins "$plugins" --list plugins-$n.txt \
              --stdlib $host/gmic/gmic_stdlib_community.h --subset pr --jobs 2 --work render-$n
            echo "::endgroup::"
          }
          # the bundle: an ARM64 host takes Win-arm64, an Arm64EC host Win-arm64ec (the Arm64X GMIC.ofx)
          test_one arm64 build-arm64 bundle-arm arm64-windows-static "" ""
          test_one arm64ec build-arm64x bundle-arm arm64ec-windows-static -arm64EC -MACHINE:ARM64EC
          # the Arm64X GMIC.ofx in an ARM64 host: from Win-arm64x, which native hosts check after Win-arm64
          rm -rf bundle-arm64x && mkdir -p bundle-arm64x/GMIC.ofx.bundle/Contents
          cp -R bundle-arm/GMIC.ofx.bundle/Contents/Info.plist bundle-arm/GMIC.ofx.bundle/Contents/Resources bundle-arm64x/GMIC.ofx.bundle/Contents/
          cp -R bundle-arm/GMIC.ofx.bundle/Contents/Win-arm64ec bundle-arm64x/GMIC.ofx.bundle/Contents/Win-arm64x
          test_one arm64x-in-arm64 build-arm64 bundle-arm64x arm64-windows-static "" ""
      - name: Upload the failed render's work directories and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-render-failure
          path: |
            render-*
            ${{ runner.temp }}/dumps
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-windows-arm64-msvc
          path: bundle-arm
          retention-days: 1
          compression-level: 9

  # Weekly and on demand: one Windows bundle for x64, Arm64EC and ARM64 hosts (Contents/Win64,
  # Win-arm64ec with the Arm64X GMIC.ofx, Win-arm64), merged from the two Windows MSVC bundles,
  # whose Info.plist and Resources must be identical. Only when both jobs succeeded: no partial
  # bundle.
  windows-bundle:
    name: Windows bundle (x64, Arm64X, ARM64)
    runs-on: ubuntu-24.04
    needs: [changes, windows, windows-arm]
    if: >-
      needs.windows.result == 'success' && needs.windows-arm.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openfx-gmic-windows-x64-msvc
          path: x64
      - uses: actions/download-artifact@v4
        with:
          name: openfx-gmic-windows-arm64-msvc
          path: arm
      - name: Merge
        run: |
          x=x64/GMIC.ofx.bundle/Contents a=arm/GMIC.ofx.bundle/Contents
          cmp $x/Info.plist $a/Info.plist
          diff -r $x/Resources $a/Resources
          rm -rf merged && mkdir -p merged && cp -R x64/GMIC.ofx.bundle merged/
          cp -R $a/Win-arm64ec $a/Win-arm64 merged/GMIC.ofx.bundle/Contents/
          [ "$(ls merged/GMIC.ofx.bundle/Contents | tr '\n' ' ')" = "Info.plist Resources Win-arm64 Win-arm64ec Win64 " ] ||
            { echo "FAIL: unexpected Contents:"; ls merged/GMIC.ofx.bundle/Contents; exit 1; }
          find merged -type f -printf '%s %P\n' | sort -k2
      - name: Upload the Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-windows-msvc
          path: merged
          retention-days: 14
          compression-level: 9
