name: Continuous Integration

# Natron CI policy: per PR/push, exactly three full builds plus tests (macOS 15 arm64 with the
# system clang and MacPorts libraries, Ubuntu 24.04, Windows MSYS2 UCRT64). Extra variants (debug
# builds, a C++20 build, LICENSE=COMMERCIAL builds on Linux) run nightly or on demand; the per-PR
# builds use C++17 (Natron RB-2.6 policy: Qt5 builds C++17, Qt6 builds C++20); build artifacts
# are uploaded only on demand or for pre-release tags.
#
# The builds use CMake (NatronGitHub/Natron#1181). The Makefile is still what Natron's
# build-plugins.sh uses on the three systems: the nightly and on-demand runs also build it on each
# (Linux: the debug variant, instead of a CMake debug build, and the COMMERCIAL release build;
# macOS and Windows: a release build),
# and compare its bundle with the installed CMake one (compare_bundles.sh). The per-PR runs only
# build with CMake.
#
# FFT: all builds use the default, pocketfft (header-only, downloaded), as Natron's builds do; the
# nightly and on-demand runs also build FFT=fftw3 (FFTW, opt-in for GPL builds) on Linux and macOS,
# and describe and render it (the pr subset, with the FFT filters).
#
# Render test (render_plugins.py, with openfx's hostDemo: GMIC_BUILD_TESTS=ON): per PR, a
# representative subset of the plug-ins (the FFT and multi-layer filters, every 30th plug-in) on
# the three systems; nightly and on demand, all the plug-ins on Linux.
#
# Frugal CI (the NatronGitHub runners are shared by all repos): one run per change. Pushes run CI
# only on master and tags; feature branches run through their pull request. Draft pull requests
# don't run CI. Superseded runs are cancelled, except for tags. The nightly run is skipped when
# master didn't change. Jobs time out.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC: also builds the variants (debug, C++20)
  # pushes to master (and tags) only: pull requests are built by the pull_request trigger,
  # so that each PR push is not built twice
  push:
    branches: [ master ]
    tags: [ '*' ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - COPYING
      - README
      - 'Licence_*.txt'
      - '.github/ISSUE_TEMPLATE/**'

# One group per event type and PR number (branch names can collide across forks) or ref (master,
# tags): a new run cancels the superseded one, except for tags. The event type keeps a master push
# from cancelling the nightly or on-demand run, which also builds the variants.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # number of plug-ins expected from the pinned G'MIC version: update when upgrading G'MIC
  GMIC_PLUGIN_COUNT: 1193
  # extra variants (debug, C++20) only on the nightly schedule or on demand
  BUILD_VARIANTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # artifacts only on demand or for pre-release tags (containing "alpha", "beta" or "rc", e.g.
  # Natron-2.6.0-rc1; contains() is case-insensitive)
  UPLOAD_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc'))) }}

jobs:
  # Skip the nightly scheduled run if master didn't change since the previous one
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' # only the scheduled run needs the history
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits in the last 25 hours: skipping."
          fi

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # the nightly and on-demand runs render all the plug-ins
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config zlib1g-dev libcurl4-openssl-dev \
            libpng-dev libexpat1-dev libgl-dev
      # the tarball, downloaded into the source directory (GMIC_DOWNLOAD_DIR), where both the
      # CMake and the Makefile builds find it
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: gmic_*.tar.gz
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
      - name: Describe all plug-ins
        run: PLUGIN_LIST=plugins.txt .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      # all the plug-ins on the nightly and on-demand runs, a subset per PR
      - name: Render plug-ins
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset "$([ "$BUILD_VARIANTS" = true ] && echo all || echo pr)" --jobs 2
      # the debug variant is built with the Makefile, as Natron's build-plugins.sh does (the
      # standard in CXX), and its bundle is compared with the installed CMake one
      - name: Build with the Makefile (debug), compare with CMake
        if: env.BUILD_VARIANTS == 'true'
        run: |
          make -j4 CONFIG=debug OPENMP=1 CXX="g++ -std=c++17"
          cmake --install build --prefix install
          .github/workflows/compare_bundles.sh GMIC_OFX/Linux-64-debug/GMIC.ofx.bundle install/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/compare_sources.sh build
      # The Linux bundle is uploaded as is (it needs libcurl, libpng, libgomp): it requires
      # the glibc of Ubuntu 24.04 anyway, where these libraries are standard packages, and bundled
      # copies of libstdc++/libgomp/libcurl could clash with the host's own. Natron's Linux
      # releases build the plug-in on their own SDK and bundle its libraries themselves.
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-linux-release
          path: build/Plugins/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DGMIC_DOWNLOAD_DIR="$PWD"
          cmake --build build-cxx20 -j4
          .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT
      # FFTW (opt-in, GPL builds only), rendered with the hostDemo of the default build
      - name: Build, describe and render (release, FFT=fftw3)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          sudo apt-get install -y libfftw3-dev
          cmake -S . -B build-fftw3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DFFT=fftw3
          cmake --build build-fftw3 -j4
          PLUGIN_LIST=plugins-fftw3.txt .github/workflows/describe_plugins.sh build-fftw3/Plugins $GMIC_PLUGIN_COUNT
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build-fftw3/Plugins --list plugins-fftw3.txt --stdlib build-fftw3/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2

  # Natron's COMMERCIAL builds (-DOFX_LICENSE=COMMERCIAL, make LICENSE=COMMERCIAL, see license.mk),
  # nightly or on demand: pocketfft (the default; FFTW is GPL), and a standard library without the
  # community filters under the GPL or a CeCILL-only licence. The bundle is checked
  # (check_commercial.sh: no FFTW, licence texts, left-out plug-ins), described and rendered (the pr
  # subset, with the FFT filters), and FFT-based filters are rendered on a 720x576 image with an
  # interpreter built from the same sources (fft_smoke.sh). The Makefile's COMMERCIAL build is
  # compared with the installed CMake one (compare_bundles.sh).
  linux-commercial:
    name: Linux (Ubuntu 24.04), LICENSE=COMMERCIAL
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # number of plug-ins of COMMERCIAL builds: update with gmic_stdlib_commercial.txt or G'MIC
      GMIC_PLUGIN_COUNT_COMMERCIAL: 808
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config zlib1g-dev libcurl4-openssl-dev libpng-dev \
            libexpat1-dev libgl-dev
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: gmic_*.tar.gz
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP, OFX_LICENSE=COMMERCIAL)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$PWD" \
            -DOFX_LICENSE=COMMERCIAL -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
      - name: Describe and check
        run: |
          DESCRIBE_LOG=$PWD/describe-commercial.log PLUGIN_LIST=plugins.txt \
            .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT_COMMERCIAL
          .github/workflows/check_commercial.sh build/Plugins describe-commercial.log
      - name: Render plug-ins (subset)
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      - name: Render FFT filters (720x576)
        run: .github/workflows/fft_smoke.sh build/gmic
      - name: Build with the Makefile (release, LICENSE=COMMERCIAL), compare with CMake
        run: |
          make -j4 CONFIG=release OPENMP=1 CXXSTD=c++17 LICENSE=COMMERCIAL
          cmake --install build --prefix install
          .github/workflows/compare_bundles.sh GMIC_OFX/Linux-64-release/GMIC.ofx.bundle install/OFX/Plugins/GMIC.ofx.bundle
          .github/workflows/compare_sources.sh build

  macos:
    name: macOS 15 arm64 (Apple clang, MacPorts libraries)
    runs-on: macos-15
    # macOS arm64 runners are scarce (Natron CI policy): start only once Linux and Windows have
    # passed. Merging only requires Linux and Windows; macOS also builds nightly.
    needs: [changes, linux, windows]
    # on the nightly and on-demand runs (which also build the variants), macOS builds even if a
    # Linux/Windows variant (debug, C++20) failed. !cancelled(), not always(): a cancelled run
    # (superseded by a newer push) must also stop a running macOS job.
    if: >-
      !cancelled() && needs.changes.outputs.run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (needs.linux.result == 'success' && needs.windows.result == 'success'))
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # Apple clang (the system compiler, pinned to /usr/bin so that a MacPorts clang_select can't
      # take over clang++) with the MacPorts libraries found through MacPorts' pkg-config, and
      # MacPorts' cmake and ninja. MacPorts LLVM/clang is not used to build on macOS.
      CMAKE_ARGS: -G Ninja -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DGMIC_DOWNLOAD_DIR=${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the only dependency cache on macOS: setup-macports caches the MacPorts installation
      # (the G'MIC sources are downloaded on each run)
      - name: Install MacPorts and dependencies
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      # OFX_DEPLOY_BUNDLES: the install step copies the MacPorts libraries into the bundle
      # (osxDeploy.sh) and signs it, as the Makefile's release builds do; the describe test runs on
      # the installed bundle, so that the deployment is tested on each PR
      - name: Build and install (release, OpenMP)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_DEPLOY_BUNDLES=ON \
            -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
          cmake --install build --prefix install
          codesign --verify --strict install/OFX/Plugins/GMIC.ofx.bundle
      - name: Describe all plug-ins
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib PLUGIN_LIST=plugins.txt \
            .github/workflows/describe_plugins.sh install/OFX/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          python3 .github/workflows/render_plugins.py --host build \
            --plugins install/OFX/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-debug $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17
          cmake --build build-debug -j4
      # the Makefile, as Natron's build-plugins.sh builds it; its release build also runs
      # osxDeploy.sh, so it is compared with the installed (deployed) CMake bundle
      - name: Build with the Makefile (release), compare with CMake
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          make -j4 CONFIG=release CC=/usr/bin/clang CXX=/usr/bin/clang++ OPENMP=1 CXXSTD=c++17
          .github/workflows/compare_bundles.sh GMIC_OFX/Darwin-64-release/GMIC.ofx.bundle install/OFX/Plugins/GMIC.ofx.bundle
      # self-contained artifact (on a copy, the install directory is left as is): the install
      # step's osxDeploy.sh (OFX_DEPLOY_BUNDLES) already copied the MacPorts dylibs into
      # Contents/Libraries; bundle_libs.sh copies any that's missing, removes the rpaths into
      # /opt/local, signs the bundle ad hoc, and fails if a dependency is neither a system library
      # nor bundled. The artifact requires the
      # runner's macOS version or newer, and must be unquarantined after download
      # (xattr -dr com.apple.quarantine GMIC.ofx.bundle); see the header of bundle_libs.sh.
      - name: Bundle libraries
        if: env.UPLOAD_ARTIFACTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          rm -rf Bundle && mkdir Bundle
          cp -R install/OFX/Plugins/GMIC.ofx.bundle Bundle/
          .github/workflows/bundle_libs.sh Bundle/GMIC.ofx.bundle
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh Bundle $GMIC_PLUGIN_COUNT
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-macos-release
          path: Bundle/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-cxx20 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          cmake --build build-cxx20 -j4
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib \
            .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT
      # FFTW (opt-in, GPL builds only; setup-macports.yaml installs fftw-3 for it), rendered with
      # the hostDemo of the default build
      - name: Build, describe and render (release, FFT=fftw3)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-fftw3 $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DFFT=fftw3
          cmake --build build-fftw3 -j4
          CXX="/usr/bin/clang++ -I/opt/local/include" \
            HOST_LDFLAGS=-L/opt/local/lib PLUGIN_LIST=plugins-fftw3.txt \
            .github/workflows/describe_plugins.sh build-fftw3/Plugins $GMIC_PLUGIN_COUNT
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build-fftw3/Plugins --list plugins-fftw3.txt --stdlib build-fftw3/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-expat mingw-w64-ucrt-x86_64-python
      - name: Cache G'MIC sources
        uses: actions/cache@v4
        with:
          path: gmic_*.tar.gz
          key: gmic-src-${{ hashFiles('Makefile') }}
      - name: Build (release, OpenMP)
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DGMIC_DOWNLOAD_DIR="$(cygpath -m "$PWD")" \
            -DGMIC_BUILD_TESTS=ON
          cmake --build build -j4
      - name: Describe all plug-ins
        run: |
          set -eo pipefail
          PLUGIN_LIST=plugins.txt .github/workflows/describe_plugins.sh build/Plugins $GMIC_PLUGIN_COUNT
      - name: Render plug-ins (subset)
        run: |
          set -eo pipefail
          python3 .github/workflows/render_plugins.py --host build \
            --plugins build/Plugins --list plugins.txt --stdlib build/gmic/gmic_stdlib_community.h \
            --subset pr --jobs 2
      - name: Build (debug)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          set -eo pipefail
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=17
          cmake --build build-debug -j4
      # the Makefile, as Natron's build-plugins.sh builds it, compared with the installed CMake
      # bundle
      - name: Build with the Makefile (release), compare with CMake
        if: env.BUILD_VARIANTS == 'true'
        run: |
          set -eo pipefail
          make -j4 CONFIG=release OPENMP=1 CXXSTD=c++17
          cmake --install build --prefix install
          .github/workflows/compare_bundles.sh \
            "$(find GMIC_OFX -maxdepth 1 -type d -name '*-release' | head -1)/GMIC.ofx.bundle" \
            install/OFX/Plugins/GMIC.ofx.bundle
      # self-contained artifact: the UCRT64 DLLs that GMIC.ofx imports (recursively, objdump -p) are
      # copied next to it, and a manifest listing them is embedded with the Windows SDK's mt.exe.
      # The describe test then runs a statically linked host with a PATH without /ucrt64/bin, so
      # that the plug-in loads only if it finds its DLLs in the bundle. The plug-in itself links
      # libstdc++/libgcc/libgomp dynamically, as the per-PR build does (see bundle_libs.sh for
      # the clash with a host's DLLs of the same names). Limitations of the artifacts: see the
      # header of bundle_libs.sh.
      - name: Collect bundle and libraries
        if: env.UPLOAD_ARTIFACTS == 'true'
        run: |
          set -eo pipefail
          rm -rf Bundle && mkdir -p Bundle
          cp -R build/Plugins/GMIC.ofx.bundle Bundle/
          .github/workflows/bundle_libs.sh Bundle/GMIC.ofx.bundle
          CXX="c++ -DXML_STATIC" HOST_LDFLAGS=-static HOST_RUN_PATH=/c/Windows/System32:/c/Windows \
            .github/workflows/describe_plugins.sh Bundle $GMIC_PLUGIN_COUNT
      - name: Upload bundle
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-gmic-windows-release
          path: Bundle/GMIC.ofx.bundle
      - name: Build and describe (release, C++20)
        if: env.BUILD_VARIANTS == 'true'
        run: |
          set -eo pipefail
          cmake -S . -B build-cxx20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          cmake --build build-cxx20 -j4
          .github/workflows/describe_plugins.sh build-cxx20/Plugins $GMIC_PLUGIN_COUNT
