name: G'MIC sources cache
description: >-
  Restore (or save at the end of the job) the G'MIC tarball and pocketfft_hdronly.h, downloaded
  into the workspace (GMIC_DOWNLOAD_DIR, GMIC_POCKETFFT), where the CMake build finds them. The key
  hashes the Makefile, which pins both (GMICVER, POCKETFFTCOMMIT, read by CMakeLists.txt).
runs:
  using: composite
  steps:
    - name: Cache G'MIC sources
      uses: actions/cache@v5
      with:
        path: |
          gmic_*.tar.gz
          pocketfft_hdronly.h
        key: gmic-src-${{ hashFiles('Makefile') }}
